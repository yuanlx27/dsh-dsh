<svg xmlns="http://www.w3.org/2000/svg" width="216" height="28" viewBox="0 0 216 28" role="img" aria-label="made with: vibe coding" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>made with: vibe coding</title>
  <defs>
    <clipPath id="r"><rect width="216" height="28" rx="6"/></clipPath>
    <linearGradient id="vibe" gradientUnits="userSpaceOnUse" x1="86" y1="0" x2="216" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.35" stop-color="#ec4899"/>
      <stop offset="0.7" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="130 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#r)">
    <rect width="86" height="28" fill="#24292f"/>
    <rect x="86" width="130" height="28" fill="url(#vibe)"/>

    <!-- shine sweep -->
    <rect x="-40" y="0" width="30" height="28" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-40;260;260" keyTimes="0;0.5;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Verdana, 'DejaVu Sans', Geneva, sans-serif" font-size="11" fill="#fff">
    <text x="43" y="18" text-anchor="middle">made with</text>
    <text x="124" y="18.5" font-size="12" font-weight="bold" letter-spacing="0.2">vibe coding</text>
  </g>

  <!-- equalizer bars: the "vibe" -->
  <g fill="#fff">
    <rect x="98" width="3" rx="1.5" y="14" height="6">
      <animate attributeName="height" values="4;14;6;11;4" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="16;6;14;9;16" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="104" width="3" rx="1.5" y="8" height="12">
      <animate attributeName="height" values="12;5;14;6;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;15;6;14;8" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" width="3" rx="1.5" y="11" height="9">
      <animate attributeName="height" values="6;12;4;14;6" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="14;8;16;6;14" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- twinkling sparkles -->
  <path d="M207 4 L208.4 8.6 L213 10 L208.4 11.4 L207 16 L205.6 11.4 L201 10 L205.6 8.6 Z" fill="#fff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M203 19 L203.8 21.2 L206 22 L203.8 22.8 L203 25 L202.2 22.8 L200 22 L202.2 21.2 Z" fill="#fff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
