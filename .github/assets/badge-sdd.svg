<svg xmlns="http://www.w3.org/2000/svg" width="224" height="28" viewBox="0 0 224 28" role="img" aria-label="made with: SDD (spec-driven development)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>made with: SDD (spec-driven development)</title>
  <defs>
    <clipPath id="r"><rect width="224" height="28" rx="6"/></clipPath>
    <linearGradient id="sdd" gradientUnits="userSpaceOnUse" x1="86" y1="0" x2="224" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="138 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#r)">
    <rect width="86" height="28" fill="#24292f"/>
    <rect x="86" width="138" height="28" fill="url(#sdd)"/>
    <rect x="-40" y="0" width="30" height="28" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-40;270;270" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Verdana, 'DejaVu Sans', Geneva, sans-serif" fill="#fff">
    <text x="43" y="18" text-anchor="middle" font-size="11">made with</text>
    <text x="120" y="18.5" font-size="12" font-weight="bold" letter-spacing="0.5">SDD</text>
    <text x="152" y="18.2" font-size="10" opacity="0.88">spec-driven</text>
  </g>

  <!-- spec document being written, then approved -->
  <rect x="97.5" y="6.5" width="12" height="15" rx="2" fill="none" stroke="#fff" stroke-width="1.3"/>
  <g stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6" fill="none">
    <line x1="100.5" y1="11" x2="106.5" y2="11" stroke-dashoffset="6">
      <animate attributeName="stroke-dashoffset" values="6;0;0;6" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="100.5" y1="14.5" x2="106.5" y2="14.5" stroke-dashoffset="6">
      <animate attributeName="stroke-dashoffset" values="6;6;0;0;6" keyTimes="0;0.15;0.3;0.85;1" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="100.5" y1="18" x2="104.5" y2="18" stroke-dashoffset="6">
      <animate attributeName="stroke-dashoffset" values="6;6;0;0;6" keyTimes="0;0.3;0.45;0.85;1" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- approval check pops in -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.85;1" dur="4s" repeatCount="indefinite"/>
    <circle cx="111" cy="20.5" r="4.2" fill="#22c55e" stroke="#fff" stroke-width="1"/>
    <path d="M109 20.6 L110.4 22 L113 19.2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- blinking cursor -->
  <rect x="214" y="9" width="1.6" height="10" fill="#fff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
