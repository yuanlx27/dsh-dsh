[package]
name = "deepseek-harness-desktop"
version = "0.2.0-rc.2"
edition = "2024"
rust-version = "1.96"
publish = false
default-run = "deepseek-harness-desktop"

[[bin]]
name = "deepseek-harness-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri-build", "dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:objc2", "dep:objc2-foundation", "dep:objc2-web-kit"]

# Avoid misaligned Mach-O LINKEDIT in host proc-macro dylibs on macOS 27.
[profile.release.build-override]
strip = "none"

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }

[dependencies]
tauri = { version = "=2.12.1", optional = true, default-features = false, features = ["wry", "compression"] }
tauri-plugin-shell = { version = "=2.4.0", optional = true }
tauri-plugin-dialog = { version = "=2.8.1", optional = true, default-features = false }
tauri-plugin-single-instance = { version = "=2.5.2", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["process", "io-util", "sync", "time", "net", "macros", "rt-multi-thread", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["stream"] }
tokio-tungstenite = "=0.28.0"
futures-util = { version = "=0.3.34", features = ["sink"] }
sha2 = "=0.10.9"
url = "=2.5.8"
libc = "=0.2.186"
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true }
objc2-web-kit = { version = "=0.3.2", optional = true }

[dev-dependencies]
base64 = "=0.22.1"
tokio = { version = "=1.53.2", features = ["test-util"] }
