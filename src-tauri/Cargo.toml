[package]
name = "deepseek-harness-desktop"
version = "0.2.0-rc.2"
edition = "2024"
rust-version = "1.96"
publish = false
default-run = "deepseek-harness-desktop"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = { version = "=2.12.1", default-features = false, features = ["wry", "compression", "macos-private-api"] }
tauri-plugin-shell = "=2.4.0"
tauri-plugin-dialog = { version = "=2.8.1", default-features = false }
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["process", "io-util", "sync", "time", "net", "macros", "rt-multi-thread", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["stream"] }
tokio-tungstenite = "=0.28.0"
futures-util = { version = "=0.3.34", features = ["sink"] }
sha2 = "=0.10.9"
url = "=2.5.8"
libc = "=0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-web-kit = "=0.3.2"

[dev-dependencies]
tempfile = "=3.27.0"
